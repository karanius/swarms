<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="544" viewBox="0 0 1040 544" role="img" aria-labelledby="title desc"><title id="title">Figure 1 · The unresolved boundary</title><desc id="desc">Figure 1. Conceptual boundary map. Arrows show information used to write a proposal, not an executed flow.</desc><rect width="1040" height="544" rx="18" fill="#111820"/><style>text{font-family:Arial,sans-serif;fill:#e6edf3} .sub{fill:#a9bac8;font-size:18px} .title{font-size:26px;font-weight:bold}</style><text x="32" y="44" class="title">Figure 1 · The unresolved boundary</text><rect x="28" y="76" width="984" height="78" rx="10" fill="#202e3b" stroke="#52758a"/><text x="48" y="106" font-size="21" font-weight="bold">REQUIRED ABOVE</text><text x="48" y="134" class="sub">An identified requirement, acceptance criterion, and phase</text><path d="M520 156v18m-5-5 5 5 5-5" stroke="#6cdbcf" fill="none" stroke-width="2"/><rect x="28" y="180" width="984" height="78" rx="10" fill="#202e3b" stroke="#52758a"/><text x="48" y="210" font-size="21" font-weight="bold">BOUNDARY RECORD</text><text x="48" y="238" class="sub">What is missing or unsupported, where it occurs, and what blocks it</text><path d="M520 260v18m-5-5 5 5 5-5" stroke="#6cdbcf" fill="none" stroke-width="2"/><rect x="28" y="284" width="984" height="78" rx="10" fill="#202e3b" stroke="#52758a"/><text x="48" y="314" font-size="21" font-weight="bold">AVAILABLE BELOW</text><text x="48" y="342" class="sub">Pinned items, typed interfaces, configurations, and resource references</text><path d="M520 364v18m-5-5 5 5 5-5" stroke="#6cdbcf" fill="none" stroke-width="2"/><rect x="28" y="388" width="984" height="78" rx="10" fill="#202e3b" stroke="#52758a"/><text x="48" y="418" font-size="21" font-weight="bold">RESOLUTION PATCH</text><text x="48" y="446" class="sub">A justified next revision, with remaining obligations preserved</text></svg>