name: swarms-langfuse

x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: http://127.0.0.1:${LANGFUSE_PORT:-3000}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:?Set LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:?Set LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  CLICKHOUSE_CLUSTER_NAME: default
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?Set LANGFUSE_REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"

x-langfuse-dependencies: &langfuse-dependencies
  langfuse-postgres:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy

services:
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    depends_on: *langfuse-dependencies
    ports:
      - 127.0.0.1:${LANGFUSE_PORT:-3000}:3000
    environment:
      <<: *langfuse-environment
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=1024
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Set LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://127.0.0.1:${LANGFUSE_MINIO_PORT:-9090}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_INIT_ORG_ID: swarms
      LANGFUSE_INIT_ORG_NAME: Swarms
      LANGFUSE_INIT_PROJECT_ID: swarm-canvas
      LANGFUSE_INIT_PROJECT_NAME: Swarm Canvas
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:?Set LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: Swarms admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:?Set LANGFUSE_ADMIN_PASSWORD}
    networks:
      - langfuse-internal

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    depends_on: *langfuse-dependencies
    environment:
      <<: *langfuse-environment
      NODE_OPTIONS: --max-old-space-size=512
    networks:
      - langfuse-internal

  langfuse-postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Set LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U langfuse -d langfuse]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - langfuse-internal

  langfuse-clickhouse:
    build:
      context: .
      dockerfile: Dockerfile.clickhouse
    image: scoredust-langfuse-clickhouse:local
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: [CMD-SHELL, "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - langfuse-internal

  langfuse-redis:
    image: docker.io/redis:7
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory-policy noeviction']
    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:?Set LANGFUSE_REDIS_PASSWORD}
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - langfuse-internal

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?Set LANGFUSE_MINIO_PASSWORD}
    ports:
      - 127.0.0.1:${LANGFUSE_MINIO_PORT:-9090}:9000
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - langfuse-internal

volumes:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-redis-data:
  langfuse-minio-data:

networks:
  langfuse-internal:
    ipam:
      config:
        - subnet: 10.243.17.0/24
