[workspace]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
codex-agent-identity = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-http-client = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-config = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-keyring-store = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-model-provider-info = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-otel = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-protocol = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-secrets = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-terminal-detection = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-utils-cargo-bin = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-utils-process = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-utils-template = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-workload-identity = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
anyhow = "1"
base64 = "0.22.1"
chrono = "0.4.43"
http = "1.3.1"
jsonwebtoken = "9.3.1"
keyring = { version = "3.6", default-features = false }
once_cell = "1.20.2"
opentelemetry_sdk = "0.31.0"
os_info = "3.12.0"
pretty_assertions = "1.4.1"
rand = "0.9"
regex-lite = "0.1.8"
serde = { version = "1", features = ["rc"] }
serde_json = "1"
serial_test = "3.2.0"
sha2 = "0.10"
tempfile = "3.23.0"
thiserror = "2.0.17"
tiny_http = "0.12"
tokio = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
url = "2"
urlencoding = "2.1"
webbrowser = "1.2.2"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
async-stream = "0.3"
clap = { version = "4.5.58", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
wiremock = "0.6"


[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[package]
name = "api-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
toml = "0.9.11"
codex-utils-process = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
codex-agent-identity = { workspace = true }
codex-http-client = { workspace = true }
codex-config = { workspace = true }
codex-keyring-store = { workspace = true }
codex-model-provider-info = { workspace = true }
codex-otel = { workspace = true }
codex-protocol = { workspace = true }
codex-secrets = { workspace = true }
codex-terminal-detection = { workspace = true }
codex-utils-template = { workspace = true }
codex-workload-identity = { workspace = true }
http = { workspace = true }
once_cell = { workspace = true }
os_info = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tiny_http = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
webbrowser = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
clap = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

[dev-dependencies]
codex-utils-cargo-bin = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
jsonwebtoken = { workspace = true }
keyring = { workspace = true }
pretty_assertions = { workspace = true }
regex-lite = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }

[lib]
name = "codex_login"
doctest = false

[[bin]]
name = "api-proxy"
path = "src/bin/api_proxy.rs"
