<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="648" viewBox="0 0 1040 648" role="img" aria-labelledby="title desc"><title id="title">Figure 3 · Bounded decision cycle</title><desc id="desc">Figure 3. Design procedure only. The return from reassessment to selection is iteration across document revisions, not a cycle inserted into the component DAG.</desc><rect width="1040" height="648" rx="18" fill="#111820"/><style>text{font-family:Arial,sans-serif;fill:#e6edf3} .sub{fill:#a9bac8;font-size:18px} .title{font-size:26px;font-weight:bold}</style><text x="32" y="44" class="title">Figure 3 · Bounded decision cycle</text><rect x="28" y="76" width="984" height="78" rx="10" fill="#202e3b" stroke="#52758a"/><text x="48" y="106" font-size="21" font-weight="bold">1 · LOCATE</text><text x="48" y="134" class="sub">Reassess obligations; select a ready requirement-scoped boundary</text><path d="M520 156v18m-5-5 5 5 5-5" stroke="#6cdbcf" fill="none" stroke-width="2"/><rect x="28" y="180" width="984" height="78" rx="10" fill="#202e3b" stroke="#52758a"/><text x="48" y="210" font-size="21" font-weight="bold">2 · PROPOSE</text><text x="48" y="238" class="sub">Generate a finite candidate batch with pinned operands and rules</text><path d="M520 260v18m-5-5 5 5 5-5" stroke="#6cdbcf" fill="none" stroke-width="2"/><rect x="28" y="284" width="984" height="78" rx="10" fill="#202e3b" stroke="#52758a"/><text x="48" y="314" font-size="21" font-weight="bold">3 · CHECK AND ORDER</text><text x="48" y="342" class="sub">Reject structural violations; retain uncertainty; apply declared policy</text><path d="M520 364v18m-5-5 5 5 5-5" stroke="#6cdbcf" fill="none" stroke-width="2"/><rect x="28" y="388" width="984" height="78" rx="10" fill="#202e3b" stroke="#52758a"/><text x="48" y="418" font-size="21" font-weight="bold">4 · WRITE</text><text x="48" y="446" class="sub">Accept one atomic specification patch; record alternatives and provenance</text><path d="M520 468v18m-5-5 5 5 5-5" stroke="#6cdbcf" fill="none" stroke-width="2"/><rect x="28" y="492" width="984" height="78" rx="10" fill="#202e3b" stroke="#52758a"/><text x="48" y="522" font-size="21" font-weight="bold">5 · REASSESS OR RETURN</text><text x="48" y="550" class="sub">Repeat with less budget, ask for information, or return a scoped result</text></svg>